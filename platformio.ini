[env]
platform = raspberrypi
framework = picosdk
build_flags = -Wl,-u,_printf_float

; Upload tool
upload_protocol = picoprobe
debug_tool = picoprobe

[env:pico2-test]
board = rpipico2
build_flags = 
    -DHSYNC_PIN=5
    -DVSYNC_PIN=4
    -DR_MSB_PIN=6
    -DR_LSB_PIN=7
    -DG_MSB_PIN=8
    -DG_LSB_PIN=9
    -DB_MSB_PIN=10
    -DB_LSB_PIN=11
    -DCUSTOM_VGA_PINS

[env:pico2-prod]
board = waveshare-rp2350-zero
build_flags = 
    -DHSYNC_PIN=14
    -DVSYNC_PIN=15
    -DR_MSB_PIN=0
    -DR_MID_PIN=1
    -DR_LSB_PIN=2
    -DG_MSB_PIN=3
    -DG_MID_PIN=4
    -DG_LSB_PIN=5
    -DB_MSB_PIN=6
    -DB_LSB_PIN=7
    -DCUSTOM_VGA_PINS