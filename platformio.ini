[env]
platform = raspberrypi
framework = picosdk
build_flags = -Wl,-u,_printf_float

; Upload tool
upload_protocol = picoprobe
debug_tool = picoprobe

[env:pico2-test]
board = rpipico2
build_flags = 
    -DHSYNC_PIN=5
    -DVSYNC_PIN=4
    -DR_MSB_PIN=6
    -DR_LSB_PIN=7
    -DG_MSB_PIN=8
    -DG_LSB_PIN=9
    -DB_MSB_PIN=10
    -DB_LSB_PIN=11
    -DCUSTOM_VGA_PINS

    -DPICO_DEFAULT_LED_PIN=25
    -DTEST_PATTERN

[env:pico2-prod]
board = waveshare-rp2350-zero
upload_protocol = picotool
build_flags = 
    -DPICO_DEFAULT_LED_PIN=16
    -DTEST_PATTERN